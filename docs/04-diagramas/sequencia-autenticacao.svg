<svg viewBox="0 0 820 1190" width="820" height="1190" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#555555"/></marker><marker id="hot" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1168BD"/></marker></defs>
<rect width="820" height="1190" fill="#ffffff"/>
<text x="30" y="34" font-size="20" font-weight="700" fill="#111111" text-anchor="start">Sequência de autenticação e chamada de API — ArqFlow</text>
<text x="30" y="56" font-size="13" font-weight="400" fill="#555555" text-anchor="start">O navegador recebe só um cookie; o JWT nunca sai do servidor (ADR-0010).</text>
<line x1="100" x2="100" y1="120" y2="1140" stroke="#999" stroke-width="1" stroke-dasharray="3 5"/>
<rect x="34" y="70" width="132" height="50" rx="8" fill="#ffffff" stroke="#8A9BB0" stroke-width="1.5"/>
<text x="100" y="92" font-size="13" font-weight="700" fill="#111111" text-anchor="middle">Navegador</text>
<text x="100" y="109" font-size="11" font-weight="400" fill="#555555" text-anchor="middle">SPA</text>
<line x1="250" x2="250" y1="120" y2="1140" stroke="#999" stroke-width="1" stroke-dasharray="3 5"/>
<rect x="184" y="70" width="132" height="50" rx="8" fill="#1168BD" stroke="#FFB000" stroke-width="3"/>
<text x="250" y="92" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">BFF</text>
<text x="250" y="109" font-size="11" font-weight="400" fill="#fff" text-anchor="middle">OAuth client</text>
<line x1="400" x2="400" y1="120" y2="1140" stroke="#999" stroke-width="1" stroke-dasharray="3 5"/>
<rect x="334" y="70" width="132" height="50" rx="8" fill="#ffffff" stroke="#8A9BB0" stroke-width="1.5"/>
<text x="400" y="92" font-size="13" font-weight="700" fill="#111111" text-anchor="middle">Entra ID</text>
<text x="400" y="109" font-size="11" font-weight="400" fill="#555555" text-anchor="middle">IdP</text>
<line x1="550" x2="550" y1="120" y2="1140" stroke="#999" stroke-width="1" stroke-dasharray="3 5"/>
<rect x="484" y="70" width="132" height="50" rx="8" fill="#ffffff" stroke="#8A9BB0" stroke-width="1.5"/>
<text x="550" y="92" font-size="13" font-weight="700" fill="#111111" text-anchor="middle">Sensedia</text>
<text x="550" y="109" font-size="11" font-weight="400" fill="#555555" text-anchor="middle">API Gateway</text>
<line x1="700" x2="700" y1="120" y2="1140" stroke="#999" stroke-width="1" stroke-dasharray="3 5"/>
<rect x="634" y="70" width="132" height="50" rx="8" fill="#ffffff" stroke="#8A9BB0" stroke-width="1.5"/>
<text x="700" y="92" font-size="13" font-weight="700" fill="#111111" text-anchor="middle">Serviço</text>
<text x="700" y="109" font-size="11" font-weight="400" fill="#555555" text-anchor="middle">Demanda/Cenários</text>
<rect x="16" y="132" width="788" height="24" rx="4" fill="#EEF2F7"/>
<text x="24" y="148" font-size="13" font-weight="700" fill="#111111" text-anchor="start">1 · Login — Authorization Code + PKCE</text>
<path d="M100 176 L250 176" fill="none" stroke="#555555" stroke-width="1.3" marker-end="url(#arrow)"/>
<text x="175.0" y="170" font-size="11.5" font-weight="400" fill="#111111" text-anchor="middle">GET /bff/user</text>
<path d="M250 206 L100 206" fill="none" stroke="#555555" stroke-width="1.3" marker-end="url(#arrow)" stroke-dasharray="6 4"/>
<text x="175.0" y="200" font-size="11.5" font-weight="400" fill="#111111" text-anchor="middle">401 sem sessão</text>
<path d="M100 236 L250 236" fill="none" stroke="#555555" stroke-width="1.3" marker-end="url(#arrow)"/>
<text x="175.0" y="230" font-size="11.5" font-weight="400" fill="#111111" text-anchor="middle">GET /bff/login</text>
<path d="M250 266 L100 266" fill="none" stroke="#555555" stroke-width="1.3" marker-end="url(#arrow)" stroke-dasharray="6 4"/>
<text x="175.0" y="260" font-size="11.5" font-weight="400" fill="#111111" text-anchor="middle">302 /authorize + PKCE</text>
<path d="M100 296 L400 296" fill="none" stroke="#555555" stroke-width="1.3" marker-end="url(#arrow)"/>
<text x="250.0" y="290" font-size="11.5" font-weight="400" fill="#111111" text-anchor="middle">Login do usuário (+ MFA)</text>
<path d="M400 326 L100 326" fill="none" stroke="#555555" stroke-width="1.3" marker-end="url(#arrow)" stroke-dasharray="6 4"/>
<text x="250.0" y="320" font-size="11.5" font-weight="400" fill="#111111" text-anchor="middle">302 /bff/signin-oidc?code&amp;state</text>
<path d="M100 356 L250 356" fill="none" stroke="#555555" stroke-width="1.3" marker-end="url(#arrow)"/>
<text x="175.0" y="350" font-size="11.5" font-weight="400" fill="#111111" text-anchor="middle">GET signin-oidc?code</text>
<path d="M250 386 L400 386" fill="none" stroke="#555555" stroke-width="1.3" marker-end="url(#arrow)"/>
<text x="325.0" y="380" font-size="11.5" font-weight="400" fill="#111111" text-anchor="middle">POST /token (code)</text>
<path d="M400 416 L250 416" fill="none" stroke="#555555" stroke-width="1.3" marker-end="url(#arrow)" stroke-dasharray="6 4"/>
<text x="325.0" y="410" font-size="11.5" font-weight="400" fill="#111111" text-anchor="middle">access + refresh + ID</text>
<rect x="175.0" y="435" width="150" height="22" rx="4" fill="#F7F7F7" stroke="#999" stroke-width="1"/>
<text x="250" y="450" font-size="11.5" font-weight="400" fill="#111111" text-anchor="middle">Grava tokens no Redis</text>
<path d="M250 478 L100 478" fill="none" stroke="#1168BD" stroke-width="2" marker-end="url(#hot)" stroke-dasharray="6 4"/>
<text x="175.0" y="472" font-size="11.5" font-weight="700" fill="#111111" text-anchor="middle">302 / + Set-Cookie</text>
<rect x="16" y="504" width="788" height="24" rx="4" fill="#EEF2F7"/>
<text x="24" y="520" font-size="13" font-weight="700" fill="#111111" text-anchor="start">2 · Chamada de API</text>
<path d="M100 548 L250 548" fill="none" stroke="#555555" stroke-width="1.3" marker-end="url(#arrow)"/>
<text x="175.0" y="542" font-size="11.5" font-weight="400" fill="#111111" text-anchor="middle">GET /bff/api/demandas</text>
<rect x="177.0" y="567" width="146" height="22" rx="4" fill="#F7F7F7" stroke="#999" stroke-width="1"/>
<text x="250" y="582" font-size="11.5" font-weight="400" fill="#111111" text-anchor="middle">Valida sessão e CSRF</text>
<path d="M250 610 L550 610" fill="none" stroke="#1168BD" stroke-width="2" marker-end="url(#hot)"/>
<text x="400.0" y="604" font-size="11.5" font-weight="700" fill="#111111" text-anchor="middle">GET /demandas · Bearer JWT</text>
<rect x="461.0" y="629" width="178" height="22" rx="4" fill="#F7F7F7" stroke="#999" stroke-width="1"/>
<text x="550" y="644" font-size="11.5" font-weight="400" fill="#111111" text-anchor="middle">Valida JWT (JWKS em cache)</text>
<path d="M550 672 L700 672" fill="none" stroke="#555555" stroke-width="1.3" marker-end="url(#arrow)"/>
<text x="625.0" y="666" font-size="11.5" font-weight="400" fill="#111111" text-anchor="middle">Bearer JWT + mTLS</text>
<rect x="620.0" y="691" width="160" height="22" rx="4" fill="#F7F7F7" stroke="#999" stroke-width="1"/>
<text x="700" y="706" font-size="11.5" font-weight="400" fill="#111111" text-anchor="middle">Revalida JWT e app role</text>
<path d="M700 734 L550 734" fill="none" stroke="#555555" stroke-width="1.3" marker-end="url(#arrow)" stroke-dasharray="6 4"/>
<text x="625.0" y="728" font-size="11.5" font-weight="400" fill="#111111" text-anchor="middle">200 dados</text>
<path d="M550 764 L250 764" fill="none" stroke="#555555" stroke-width="1.3" marker-end="url(#arrow)" stroke-dasharray="6 4"/>
<text x="400.0" y="758" font-size="11.5" font-weight="400" fill="#111111" text-anchor="middle">200</text>
<path d="M250 794 L100 794" fill="none" stroke="#555555" stroke-width="1.3" marker-end="url(#arrow)" stroke-dasharray="6 4"/>
<text x="175.0" y="788" font-size="11.5" font-weight="400" fill="#111111" text-anchor="middle">200 JSON da tela</text>
<rect x="16" y="820" width="788" height="24" rx="4" fill="#EEF2F7"/>
<text x="24" y="836" font-size="13" font-weight="700" fill="#111111" text-anchor="start">3 · Renovação do access token (no BFF, invisível para a SPA)</text>
<rect x="172.0" y="851" width="156" height="22" rx="4" fill="#F7F7F7" stroke="#999" stroke-width="1"/>
<text x="250" y="866" font-size="11.5" font-weight="400" fill="#111111" text-anchor="middle">Access token expirando</text>
<path d="M250 894 L400 894" fill="none" stroke="#555555" stroke-width="1.3" marker-end="url(#arrow)"/>
<text x="325.0" y="888" font-size="11.5" font-weight="400" fill="#111111" text-anchor="middle">POST /token (refresh)</text>
<path d="M400 924 L250 924" fill="none" stroke="#555555" stroke-width="1.3" marker-end="url(#arrow)" stroke-dasharray="6 4"/>
<text x="325.0" y="918" font-size="11.5" font-weight="400" fill="#111111" text-anchor="middle">Novos tokens (rotação)</text>
<rect x="188.0" y="943" width="124" height="22" rx="4" fill="#F7F7F7" stroke="#999" stroke-width="1"/>
<text x="250" y="958" font-size="11.5" font-weight="400" fill="#111111" text-anchor="middle">Atualiza o Redis</text>
<rect x="16" y="980" width="788" height="24" rx="4" fill="#EEF2F7"/>
<text x="24" y="996" font-size="13" font-weight="700" fill="#111111" text-anchor="start">4 · Logout</text>
<path d="M100 1024 L250 1024" fill="none" stroke="#555555" stroke-width="1.3" marker-end="url(#arrow)"/>
<text x="175.0" y="1018" font-size="11.5" font-weight="400" fill="#111111" text-anchor="middle">POST /bff/logout</text>
<rect x="175.0" y="1043" width="150" height="22" rx="4" fill="#F7F7F7" stroke="#999" stroke-width="1"/>
<text x="250" y="1058" font-size="11.5" font-weight="400" fill="#111111" text-anchor="middle">Apaga sessão e tokens</text>
<path d="M250 1086 L100 1086" fill="none" stroke="#555555" stroke-width="1.3" marker-end="url(#arrow)" stroke-dasharray="6 4"/>
<text x="175.0" y="1080" font-size="11.5" font-weight="400" fill="#111111" text-anchor="middle">302 + cookie expirado</text>
<path d="M100 1116 L400 1116" fill="none" stroke="#555555" stroke-width="1.3" marker-end="url(#arrow)"/>
<text x="250.0" y="1110" font-size="11.5" font-weight="400" fill="#111111" text-anchor="middle">Encerra sessão SSO (end_session)</text>
<text x="24" y="1172" font-size="11.5" font-weight="400" fill="#555555" text-anchor="start">Front Door omitido: todas as chamadas do navegador passam por ele. Tracejado = resposta.</text>
</svg>